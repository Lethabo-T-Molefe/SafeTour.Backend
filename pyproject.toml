[project]
name = "safetour"
version = "0.1.0"
description = "SafeTour AI Sentinel — safety-aware mobility and daily-decision platform API (FastAPI modular monolith)"
readme = "README.md"
authors = [
    { name = "Lethabo Tshegofatso Molefe", email = "lethabomolefe69@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=23.1.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.141.1",
    "geoalchemy2>=0.15.2",
    "httpx>=0.28.1",
    "langchain-core>=0.3.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.13.0",
    "python-dotenv>=1.2.2",
    "shapely>=2.0.6",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.1",
]

[build-system]
requires = ["uv_build>=0.10.12,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "types-shapely>=2.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI's Depends()/Query() in defaults is the idiomatic pattern

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["safetour"]
mypy_path = "src"

[tool.uv]
package = true
